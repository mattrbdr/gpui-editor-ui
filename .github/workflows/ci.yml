name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.89 is the workspace's rust-version.
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p gpui-editor-core --all-targets
      - run: cargo test -p gpui-editor-core

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for GPUI
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libvulkan-dev libfreetype-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - run: cargo clippy -p gpui-editor-ui --all-targets
      # Library alone, without the test-support feature that the tests enable.
      - run: cargo clippy -p gpui-editor-ui
      - run: cargo test -p gpui-editor-ui
      - run: cargo build -p gpui-editor-ui --example spike
