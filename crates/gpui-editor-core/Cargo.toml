[package]
name = "gpui-editor-core"
description = "Headless rich-text block document model with ProseMirror/TipTap JSON support (no UI dependency)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gpui-editor-core"
readme = "README.md"
keywords = ["prosemirror", "tiptap", "markdown", "rich-text", "editor"]
categories = ["text-editors", "parser-implementations", "data-structures"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[[bench]]
name = "core"
harness = false

[lints]
workspace = true
